<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusFest Growth Center</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE a growth team's daily tool: calm, plain, trusted for decisions
   IDEA a printed weekly status sheet: one verdict, three forecast numbers, four tiles, one chart, then what we are doing
   PICTURE the forecast band narrowing week by week toward the target line
   COLOUR white paper, black ink, grey rules; red only for Act, amber for Warn
   TYPE Inter throughout, tabular figures
   LAYOUT left menu, one column of content, analyst slides in from the right */
:root{color-scheme:light;--bg:#fff;--ink:#111418;--mute:#5d6570;--line:#e6e8eb;--soft:#f6f7f8;--act:#c8281e;--warn:#a85a00;--watch:#6b7280;--good:#1f7a4d}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
h1{font-size:clamp(22px,2.6vw,28px);line-height:1.15;margin:0 0 6px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:16px;margin:0 0 10px;letter-spacing:-.005em}
h3{font-size:14px;margin:0 0 6px}
p{margin:0 0 10px}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:16px;padding:0 10px 2px}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--mute);margin-bottom:14px}
.side a{text-decoration:none;padding:8px 10px;border-radius:7px;color:var(--mute);font-weight:500;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.side a:hover{background:var(--soft);color:var(--ink)}
.side a[aria-current=page]{background:var(--soft);color:var(--ink);font-weight:600}
.side .count{font-size:11.5px;background:var(--act);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:10px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.bar .sp{flex:1}
.bar select,.bar input{border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-height:36px;background:#fff;font-size:14px}
.bar .wk{font-size:13px;color:var(--mute);white-space:nowrap}
main{padding:22px 28px 60px;max-width:1180px}
.sub{color:var(--mute);margin-bottom:18px}
.label{display:inline-block;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-weight:500}
.label.sim{color:#7a4d00;border-color:#f0d9b5;background:#fff8ec}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12.5px;color:var(--mute)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:2px 0}
.kpi .s{font-size:12.5px;color:var(--mute)}
.tag{font-size:10.5px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px}
.two{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.two{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:10px;padding:16px}
.fig{position:relative;min-height:280px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:11.5px Inter,sans-serif;fill:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.flag{padding:11px 0;border-bottom:1px solid var(--line)}
.flag:last-child{border-bottom:0}
.flag .t{font-weight:600;font-size:14px}
.flag .e{font-size:13px;color:var(--mute);margin:2px 0 6px}
.lvl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.lvl.act{color:var(--act)}.lvl.warn{color:var(--warn)}.lvl.watch{color:var(--watch)}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:7px;padding:6px 12px;min-height:34px;font-weight:600;font-size:13px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,tr:focus-visible{outline:2px solid #2f6fed;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bets td:first-child{min-width:165px}.bets th,.bets td{padding-left:6px;padding-right:6px}
.scroll{overflow-x:auto;background:linear-gradient(90deg,#fff 30%,rgba(255,255,255,0)) left/24px 100% no-repeat local,linear-gradient(270deg,#fff 30%,rgba(255,255,255,0)) right/24px 100% no-repeat local,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.16),rgba(0,0,0,0)) right/10px 100% no-repeat scroll;}
@media (max-width:700px){.scroll::before{content:'Swipe the table sideways →';display:block;font-size:12px;color:#6b7280;margin:0 0 4px}}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:12px;white-space:nowrap;background:var(--soft)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.note{font-size:12.5px;color:var(--mute)}
.v-Scale{color:var(--good);font-weight:700}.v-Keep{color:var(--ink);font-weight:600}.v-Change{color:var(--warn);font-weight:700}.v-Stop{color:var(--act);font-weight:700}.v-early{color:var(--watch);font-weight:600}
.funnel .r{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 110px;gap:12px;align-items:center;padding:6px 0;font-size:13.5px}
.funnel .b{height:14px;background:var(--soft);border-radius:3px;overflow:hidden}
.funnel .b i{display:block;height:100%;background:var(--ink)}
.funnel .b i.hot{background:var(--act)}
.funnel .x{text-align:right;white-space:nowrap}
form.f{display:grid;gap:10px}
form.f>.btn,form.f>.row{justify-self:start}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
label.l{display:grid;gap:4px;font-size:12.5px;color:var(--mute)}
label.l input,label.l select,label.l textarea{font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;min-height:38px;color:var(--ink)}
.board{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.col{background:var(--soft);border-radius:10px;padding:10px;min-height:120px}
.task{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font-size:13.5px}
.task.over{border-color:var(--act)}
.task .m{color:var(--mute);font-size:12.5px;margin:3px 0 6px}
details{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:12px}
.stack>*+*{margin-top:22px}
/* drawers */
.scrim{position:fixed;inset:0;background:rgba(17,20,24,.25);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.08)}
.drawer .hd{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer .hd h2{margin:0;margin-right:auto}
.drawer .bd{padding:16px 18px;overflow-y:auto;flex:1}
#chat{display:none}#chat.open{display:flex}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.m{font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--soft);border-radius:12px;padding:8px 12px;max-width:85%}
.m.a .tools{font-size:11.5px;color:var(--mute);margin-top:6px}
.m.sys{font-size:12.5px;color:var(--mute)}
.empty{color:var(--mute);font-size:13.5px}
.sugg{display:grid;gap:6px;margin-top:10px}
.sugg button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:13px}
.sugg button:hover{border-color:var(--ink)}
.composer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;height:44px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,160%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:50;display:flex;gap:10px;align-items:center;max-width:min(560px,92vw);font-size:14px;transition:transform .2s}
#toast.show{transform:translate(-50%,0)}
#toast .btn{background:#fff;color:var(--ink);border-color:#fff}
.loading{padding:60px 20px;color:var(--mute)}
.wk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;margin:4px 0 22px;overflow:hidden}
.wk>div{padding:12px 16px;border-right:1px solid var(--line);font-size:14px}.wk>div:last-child{border-right:0}
.wk .l{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
h2.sec{font-size:15px;margin:0 0 8px}
table.score td{vertical-align:middle}table.score td:first-child{font-weight:600;white-space:nowrap}
table.score td.over{color:var(--act);font-weight:700}
.up{color:var(--good);font-size:12px;font-weight:600;white-space:nowrap}.dn{color:var(--act);font-size:12px;font-weight:600;white-space:nowrap}
table.stages tr.on td{background:#eef3fe}
.tl .mk.lo{top:44px;height:30px}
.att{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.att .card{padding:4px 16px}.att .flag{border:0}
table.score td:last-child span[class^=v-]{white-space:nowrap}
.kpi .vd{margin-top:6px}.kpi .early{font-size:22px;color:var(--mute)}.kpi .s{line-height:1.45}
p.brief{margin:-12px 0 4px}
.watch{border:1px solid #f3d6a8;background:#fffaf2;border-radius:9px;padding:9px 13px;font-size:14px;margin:12px 0 22px}.watch.ok{border-color:#bfe3cd;background:#f3fbf6}.watch .lvl{margin-right:8px}
table.score tr.tot td{font-weight:700;background:#fafbfc}
dl.plan dt{margin-top:10px}dl.plan{margin-top:0}
.moneyline{background:var(--soft);border-radius:8px;padding:9px 13px;font-size:13.5px}
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ph>div{flex:1 1 420px}
.link{background:none;border:0;padding:4px 0;color:#2f6fed;font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.banner{background:#fff8ec;border:1px solid #f0d9b5;color:#5c3b00;border-radius:9px;padding:9px 13px;font-size:13.5px;margin:0 0 16px}
.i{display:inline-grid;place-items:center;width:15px;height:15px;border:1px solid #c9ced4;border-radius:50%;font:700 10px/1 Inter,sans-serif;color:var(--mute);margin-left:5px;cursor:help;position:relative;vertical-align:1px;font-style:normal;text-transform:none;letter-spacing:0}
#tipbox{position:fixed;display:none;max-width:min(320px,86vw);background:var(--ink);color:#fff;font:400 12.5px/1.5 Inter,sans-serif;padding:8px 11px;border-radius:7px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none}
.i:focus{outline:2px solid #2f6fed;outline-offset:1px}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;vertical-align:4px;margin-right:4px;border:1px solid}
.pill.ok{color:var(--good);background:#eaf6ef;border-color:#bfe3cd}.pill.warn{color:var(--warn);background:#fff4e5;border-color:#f3d6a8}.pill.act{color:var(--act);background:#fdecea;border-color:#f3c3bd}
h1 .pill{font-size:14px;vertical-align:5px}
.tl{margin:4px 0 18px;padding:34px 0 20px;position:relative}
.tl .track{position:relative;height:26px;background:var(--soft);border-radius:6px}
.tl .tk{position:absolute;top:0;height:26px;border:0;border-left:1px solid #fff;background:transparent;font-size:11px;color:var(--mute);padding:0;cursor:pointer}
.tl .tk:hover{background:#eceef0}.tl .tk.on{background:#dfe3e8;color:var(--ink);font-weight:700}
.tl .band{position:absolute;top:27px;height:4px;background:#d7dbe0;font-size:10.5px;color:var(--mute);padding-top:5px;line-height:1;border-radius:2px;text-indent:2px}
.tl .mk{position:absolute;top:27px;border-left:2px solid #2f6fed;height:14px;font-size:10.5px;color:#2f6fed;padding:4px 0 0 4px;white-space:nowrap}
.tl .fest{position:absolute;top:0;height:26px;background:#111418;opacity:.85;border-radius:3px;pointer-events:none}
.tl .now{position:absolute;top:-4px;height:34px;border-left:2px dashed #111418;pointer-events:none}
.tl .pin{position:absolute;top:-30px;transform:translateX(-50%);display:flex;align-items:center;white-space:nowrap;z-index:2}
.tl .pin button{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:2px 9px;cursor:pointer}
.tl .pin.on button{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl .pin-result{top:auto;bottom:-30px;transform:translateX(-90%)}.tl .pin-eve{transform:translateX(-100%)}
.tl{padding-bottom:36px}
.tl .pin .short{display:none}
.cp ul.dec li .btn{flex:none}
.cp{border:1px solid var(--ink);border-radius:10px;padding:16px 18px;margin-bottom:18px;background:#fcfcfd}
.cp h2{font-size:17px}
.cp ul{margin:6px 0 10px;padding-left:18px}.cp li{margin:4px 0}
.cp ul.dec{list-style:none;padding:0}.cp ul.dec li{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:7px 0}
.impact{background:#eef3fe;border-radius:8px;padding:9px 12px;font-size:13.5px}
.nextcp{margin:-6px 0 14px}
table.check td{border-bottom:1px solid var(--line);padding:7px 8px}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:700;font-size:12px}.ck.ok{background:#eaf6ef;color:var(--good)}.ck.warn{background:#fff4e5;color:var(--warn)}
.fc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.fc>div{padding:12px 16px;border-right:1px solid var(--line);display:grid;gap:2px}.fc>div:last-child{border-right:0}
.fc .l{font-size:12.5px;color:var(--mute)}.fc b{font-size:24px;letter-spacing:-.02em}.fc .mid{background:var(--soft)}.fc .mid b{font-size:28px}.fc .vs b{color:var(--act)}
.stack2{display:grid;gap:22px;align-content:start}
.three{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
h2.good{color:var(--good)}h2.bad{color:var(--act)}
.stackbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--soft)}.stackbar i{display:block;height:100%}
.legend .sw{width:11px;height:11px;border:0;border-radius:2px;vertical-align:-1px}
.fly{display:grid;gap:6px;font-size:13px}
.fly .fh,.fly .fr2{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,180px) minmax(0,1fr) 116px;gap:10px;align-items:center}
.fly .fh{font-size:12px;color:var(--mute);font-weight:600}.fly .fh span:first-child{text-align:right}
.fly .lb{display:flex;flex-direction:row-reverse;align-items:center;gap:6px}.fly .lb i{display:block;height:14px;background:#111418;border-radius:3px 0 0 3px}
.fly .rb{display:flex;align-items:center;gap:6px}.fly .rb i{display:block;height:14px;background:#2f6fed;border-radius:0 3px 3px 0}
.fly .nm{text-align:center;font-weight:600}.fly .ce{text-align:right;white-space:nowrap}.fly .ce.over{color:var(--act);font-weight:700}
.cap{height:14px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 8px}.cap i{display:block;height:100%;background:#111418}.cap i.hot{background:var(--act)}
.funnel .b i.est{background:repeating-linear-gradient(45deg,#111418 0 6px,#5d6570 6px 9px)}
ul.plain{list-style:none;padding:0;margin:4px 0 10px}ul.plain li{padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.g-High{color:var(--good);font-weight:700}.g-Medium{color:var(--warn);font-weight:700}.g-Low{color:var(--act);font-weight:700}
dl.qa{margin:8px 0 14px}dl.qa dt{font-weight:700;margin-top:12px}dl.qa dd{margin:3px 0 0;color:#2c3238}
.addt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.addt input[name=title]{flex:1 1 260px}
.addt input,.addt select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-height:36px;background:#fff}
table.tasks input,table.tasks select{border:1px solid transparent;border-radius:6px;padding:5px 7px;background:transparent;width:100%;min-width:0}
table.tasks input:hover,table.tasks select:hover,table.tasks input:focus,table.tasks select:focus{border-color:var(--line);background:#fff}
table.tasks td:first-child{min-width:260px}
table.tasks tr.done input[data-f=title]{text-decoration:line-through;color:var(--mute)}
table.tasks tr.late td{background:#fff7f6}

@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .brand,.side .foot{display:none}
  .side a{flex:none}
  .bar{padding:10px 16px;position:static}
  main{padding:18px 16px 60px}
  .kpi{border-right:0;border-bottom:1px solid var(--line)}
  table{font-size:12.5px}th,td{padding:7px 6px}
  .funnel .r{grid-template-columns:minmax(90px,130px) minmax(0,1fr) 92px}
  .fc{grid-template-columns:repeat(2,minmax(0,1fr))}.fc>div:nth-child(2){border-right:0}.fc>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .fly .fh,.fly .fr2{grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);}.fly .ce,.fly .fh span:last-child{grid-column:1/-1;text-align:center}
  .tl .pin button{font-size:10.5px;padding:2px 6px}
  .wk{grid-template-columns:minmax(0,1fr)}.wk>div{border-right:0;border-bottom:1px solid var(--line)}
  .tl .pin .long{display:none}.tl .pin .short{display:inline}
  .cp ul.dec li{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav" aria-label="Sections">
    <div class="brand">Growth Center<small id="evname">CampusFest</small></div>
    <a href="#overview">Overview</a>
    <a href="#journey">Journey</a>
    <a href="#funnel">Funnel</a>
    <a href="#campaigns">Campaigns</a>
    <a href="#bets" id="navBets">Bets</a>
    <a href="#insights">Insights <span class="count" id="sigCount" hidden></span></a>
    <a href="#money">Money</a>
    <a href="#tasks">Tasks</a>
    <a href="#event" id="navEvent" hidden>Fest days</a>
    <a href="#data">Data</a>
    <div class="foot" id="saveState"></div>
  </nav>
  <div>
    <div class="bar">
      <label for="dsSel" class="note">Data</label>
      <select id="dsSel"><option value="live27">2027 plan (simulated)</option><option value="25">2025 actual</option></select>
      <button class="btn ghost sm" id="origToggle" type="button" hidden></button>
      <label for="asOf" class="note">As of</label>
      <button class="btn ghost sm" id="prevWk" type="button" aria-label="Earlier">‹</button>
      <select id="asOf"></select>
      <button class="btn ghost sm" id="nextWk" type="button" aria-label="Later">›</button>
      <span class="sp"></span>
      <button class="btn" id="askBtn" type="button">Ask the analyst</button>
    </div>
    <main id="main"><div class="loading">Loading…</div></main>
  </div>
</div>
<aside class="drawer" id="chat" aria-label="AI growth analyst">
  <div class="hd"><h2>Growth Analyst</h2><span class="note" id="aiState"></span><button class="btn ghost sm" id="chatClear" type="button">New chat</button><button class="btn ghost sm" id="chatClose" type="button">Close</button></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="composer" id="composer"><textarea id="q" placeholder="Ask about campaigns, bets, budget, tasks…" aria-label="Question for the analyst"></textarea><button class="btn" id="send" type="submit">Ask</button></form>
</aside>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
